name: PR Agent
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  # issue_comment:
jobs:
  pr_agent_job:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - name: Create GitHub App token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e # v1.11.6
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: PR Agent action step
        uses: the-pr-agent/pr-agent@0bd56c0508504c718cc03d504cd4ceb6725ba3c7 # v0.35.0
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          config.model: "moonshotai/kimi-k2.6"
          config.ai_timeout: "600"
          # GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI__KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI__API_BASE: https://integrate.api.nvidia.com/v1
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "false"
